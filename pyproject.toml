[project]
name = "job-automation"
version = "0.1.0"
description = "Automate filling job applications across multiple job boards and track them from the command line."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic[email]>=2.0",
    "selenium>=4.15",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
job-automation = "job_automation.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
