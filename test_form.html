<!DOCTYPE html>
<html>
<head>
    <title>Test Job Application Form</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; font-size: 16px; }
        button { background: #007bff; color: white; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Job Application Form</h1>
    <p>Test form for autofill demo</p>

    <form id="job-app-form">
        <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
            <label for="linkedIn">LinkedIn URL</label>
            <input type="url" id="linkedIn" name="linkedIn">
        </div>

        <div class="form-group">
            <label for="experience">Tell us about your experience</label>
            <textarea id="experience" name="experience" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="availability">When can you start?</label>
            <input type="text" id="availability" name="availability">
        </div>

        <button type="submit">Submit Application</button>
    </form>

    <script>
        document.getElementById('job-app-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted! Check the console for values.');
            console.log('Form data:', new FormData(this));
        });
    </script>
</body>
</html>
